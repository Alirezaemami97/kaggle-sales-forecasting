[tool.poetry]
name = "alireza-demand-forecasting"
version = "0.1.0"
description = "Production-style demand forecasting system (M5) with automated retraining and a deployment harness"
authors = ["Alirezaemami97"]
readme = "README.md"
packages = [{include = "demand_forecasting", from = "src"}]

[tool.poetry.dependencies]
python = "~3.12"
pandas = "^2.2"
pyarrow = ">=15,<22"
lightgbm = "^4.3"
pydantic = "^2.7"
mlflow = "^2.13"
pyyaml = "^6.0"
tabulate = "^0.9"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2"
ruff = "^0.4"
mypy = "^1.10"
types-pyyaml = "^6.0.12"

# EDA-only tooling — not installed in CI or Docker (poetry install --with eda)
[tool.poetry.group.eda]
optional = true

[tool.poetry.group.eda.dependencies]
ipykernel = "^6.29"
nbconvert = "^7.16"
matplotlib = "^3.8"

# TFT (M5) — heavy deep-learning deps, kept out of CI/Docker (poetry install --with tft).
# u8darts[torch] pulls only the PyTorch model flavour (no Prophet/statsforecast build pain).
[tool.poetry.group.tft]
optional = true

[tool.poetry.group.tft.dependencies]
u8darts = {version = "^0.30", extras = ["torch"]}
# Pin below torch 2.6: newer wheels bundle a deeply-nested license tree in
# dist-info that overflows Windows MAX_PATH (260) even with the venv outside
# the project. CPU wheels only; the GPU run is the AWS track.
torch = ">=2.2,<2.6"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["demand_forecasting"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
