[tool.poetry]
name = "alireza-demand-forecasting"
version = "0.1.0"
description = "Production-style demand forecasting system (M5) with automated retraining and a deployment harness"
authors = ["Alirezaemami97"]
readme = "README.md"
packages = [{include = "demand_forecasting", from = "src"}]

[tool.poetry.dependencies]
python = "~3.12"
pandas = "^2.2"
pyarrow = ">=15,<22"
lightgbm = "^4.3"
pydantic = "^2.7"
mlflow = "^2.13"
pyyaml = "^6.0"
tabulate = ">=0.9,<1"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2"
ruff = "^0.4"
mypy = "^1.10"
types-pyyaml = "^6.0.12"

# EDA-only tooling — not installed in CI or Docker (poetry install --with eda)
[tool.poetry.group.eda]
optional = true

[tool.poetry.group.eda.dependencies]
ipykernel = "^6.29"
nbconvert = "^7.16"
matplotlib = "^3.8"

# TFT (M5) — heavy deep-learning deps, kept out of CI/Docker (poetry install --with tft).
# u8darts[torch] pulls only the PyTorch model flavour (no Prophet/statsforecast build pain).
[tool.poetry.group.tft]
optional = true

[tool.poetry.group.tft.dependencies]
u8darts = {version = "^0.30", extras = ["torch"]}
# Pin below torch 2.6: newer wheels bundle a deeply-nested license tree in
# dist-info that overflows Windows MAX_PATH (260) even with the venv outside
# the project. CPU wheels only; the GPU run is the AWS track.
torch = ">=2.2,<2.6"

# Drift dashboards (M6) — Evidently is heavy and optional (poetry install --with
# monitoring). The always-on PSI drift signal in monitoring/drift.py needs none of it.
[tool.poetry.group.monitoring]
optional = true

[tool.poetry.group.monitoring.dependencies]
evidently = "^0.4"

# AWS-native deployment track — boto3 for the S3/upload scripts, moto to mock AWS
# in tests. Optional (poetry install --with aws); CI/Docker never install it.
[tool.poetry.group.aws]
optional = true

[tool.poetry.group.aws.dependencies]
boto3 = "^1.34"
moto = {version = "^5.0", extras = ["s3"]}
sagemaker = "^2.220"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["demand_forecasting"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

# tft.py subclasses pytorch_lightning.Callback (optional `tft` group) inside a
# function, so mypy resolves the base class to a concrete type when the group
# is installed (this dev machine) and to Any when it's absent (CI) — with
# ignore_missing_imports, the same "# type: ignore[misc]" on that class
# statement is legitimately needed in one environment and unused in the
# other. warn_unused_ignores is disabled for just this module rather than
# project-wide so the optional dependency stays genuinely optional.
[[tool.mypy.overrides]]
module = "demand_forecasting.training.tft"
warn_unused_ignores = false

[tool.pytest.ini_options]
testpaths = ["tests"]
# Make the standalone aws/ operational scripts and the SageMaker entry point
# importable by their tests.
pythonpath = ["aws/scripts", "aws/sagemaker"]
